<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fairsheet</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 360px; padding: 14px 16px 12px; }
      h2 { font-size: 12px; font-weight: 500; color: var(--text-3); letter-spacing: 0; }
    </style>
  </head>
  <body>
    <header class="head">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="var(--accent)" />
        <path d="M6.5 7.5h11M6.5 11.5h6" stroke="#fff" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round" />
        <path d="M11.5 16.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div>
        <h1>Fairsheet</h1>
        <p id="account" class="muted small">Checking sign-in…</p>
      </div>
    </header>

    <section class="block" aria-labelledby="job-h">
      <h2 id="job-h">This job</h2>
      <div id="job" class="muted">Looking up this page…</div>
      <div class="row">
        <input id="company" placeholder="Search your tracker by company" aria-label="Company" style="flex: 1" />
        <button id="search">Find</button>
      </div>
    </section>

    <section class="block" aria-labelledby="fill-h">
      <h2 id="fill-h">Fill the application</h2>
      <div class="row">
        <button id="autofill" class="primary">Autofill this page</button>
        <label class="check"><input id="with-resume" type="checkbox" checked /> Attach resume</label>
      </div>
      <p id="fill-result" class="soft" role="status" style="margin-top: 8px"></p>
    </section>

    <section class="block" aria-labelledby="queue-h">
      <h2 id="queue-h">Apply queue</h2>
      <p id="queue-summary" class="soft" role="status">Checking…</p>
      <div class="row" style="margin-top: 8px">
        <button id="queue-start" class="primary" hidden>Open and fill ready jobs</button>
        <button id="queue-stop" hidden>Stop</button>
      </div>
      <ol id="queue-results" class="results"></ol>
    </section>

    <div class="row" style="padding-top: 10px">
      <button id="save">Save this job</button>
      <button id="options" class="quiet">Profile and settings</button>
    </div>
    <p class="muted small" style="margin-top: 8px">Fairsheet fills fields and attaches your resume. You review and submit.</p>
    <script src="lib/urlkey.js"></script>
    <script src="lib/fieldmap.js"></script>
    <script src="lib/autoapply.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
