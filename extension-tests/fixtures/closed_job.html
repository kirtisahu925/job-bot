<!doctype html>
<!-- A job page whose posting has closed, with its old application form still on the page. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Backend Engineer - closed</title>
  </head>
  <body>
    <h1>Backend Engineer</h1>
    <p class="banner">No longer accepting applications</p>
    <form onsubmit="window.__submitted = true; return false">
      <label for="first">First name</label>
      <input id="first" name="first_name" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" />
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
