<!doctype html>
<!-- Hand-made approximation of a Workday step: labels are separate elements, inputs carry data-automation-id,
     and a React-style controlled input only accepts values set through the native setter + input event. -->
<html>
  <body>
    <div data-automation-id="legalNameSection">
      <div><label data-automation-id="formLabel">Given Name(s)</label><div><input data-automation-id="legalNameSection_firstName" type="text" /></div></div>
      <div><label data-automation-id="formLabel">Family Name</label><div><input data-automation-id="legalNameSection_lastName" type="text" /></div></div>
    </div>
    <div><div data-automation-id="formLabel">Email Address</div><div><input data-automation-id="email" type="text" /></div></div>
    <div><div data-automation-id="formLabel">Phone Number</div><div><input data-automation-id="phone-number" type="text" /></div></div>
    <div><div data-automation-id="formLabel">City</div><div><input id="react-city" data-automation-id="addressSection_city" type="text" /></div></div>
    <div><div data-automation-id="formLabel">Already filled</div><div><input id="prefilled" type="text" value="keep me" /></div></div>
    <script>
      // mimic a React controlled input: it tracks value only via the input event
      const city = document.getElementById("react-city");
      city.addEventListener("input", (e) => (window.__reactCity = e.target.value));
    </script>
  </body>
</html>
