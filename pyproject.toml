[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobbot"
version = "0.1.0"
description = "Twice-daily job scanner that scores jobs and tailors a one-page LaTeX resume per job"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "pyyaml>=6",
  "jinja2>=3.1",
  "typer>=0.12",
  "tenacity>=8.2",
  "beautifulsoup4>=4.12",
  "pdfplumber>=0.11",
  "google-genai>=1.0",
  # LinkedIn / Indeed / Naukri scrapers. Newer fixes live on the project's main branch;
  # swap this line for a git+https pin if a site breaks on the PyPI release.
  "python-jobspy==1.1.82",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
jobbot = "jobbot.cli:app"

[tool.setuptools.packages.find]
include = ["jobbot*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: typer.Option defaults are the typer idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["latex: needs pdflatex or tectonic on PATH"]
