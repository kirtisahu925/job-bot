name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern poppler-utils > /dev/null
      - run: pip install -q -e ".[dev,claude]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Design scan (impeccable detector on every page in demo mode, desktop and phone)
        run: |
          # a separate demo build: the production build points at the real Supabase project
          VITE_DEMO=1 npx vite build --outDir /tmp/dist-demo --emptyOutDir > /dev/null
          npx vite preview --outDir /tmp/dist-demo --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          # Ubuntu 24.04 runners restrict Chrome's sandbox; the scan only loads our own pages
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$(command -v google-chrome || command -v chromium)" > /tmp/chrome
          chmod +x /tmp/chrome
          export IMPECCABLE_BROWSER=/tmp/chrome
          # run from the repository root so the detector reads .impeccable/config.json (its recorded exceptions)
          detect() { (cd .. && .claude/skills/impeccable/scripts/impeccable "$@"); }
          fail=0
          for route in jobs jobs/demo-8 jobs/demo-1 skills add board consumption runs contacts contacts/p-3 contacts/import contacts/settings applications companies activity preferences settings; do
            for viewport in 1440x900 390x844; do
              detect detect --no-advisory --viewport "$viewport" "http://localhost:4173/$route" || fail=1
            done
          done
          detect detect --no-advisory extension/popup.html extension/options.html extension/ui.css || fail=1
          exit $fail

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension-tests/package-lock.json
      - run: npm ci
      - name: Unit tests (URL keys shared with the bot, field matching)
        run: npm test
      - name: Browser tests (autofill, extraction, extension loads)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Package the extension (unzip it, then chrome://extensions > Load unpacked)
        working-directory: extension
        run: zip -qr ../fairsheet-extension.zip . -x "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: fairsheet-extension
          path: fairsheet-extension.zip
