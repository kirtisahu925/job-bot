# MASTER PROFILE: the single source of truth the bot tailors from.
#
# This is an EXAMPLE with illustrative content. Replace every value with your real history, then either:
#   - save it as profile/master_profile.yaml (git-ignored) for local runs, or
#   - paste the whole file into the GitHub secret MASTER_PROFILE_YAML for scheduled runs.
# Delete the `example: true` line when done; the bot refuses to run on an example profile.
#
# Rules that keep the tailoring honest:
#   - Only write what you can defend in an interview. The LLM may reword and reorder, never invent.
#   - Every skill the resume may mention must appear in `skills` or `extra_vocabulary`.
#   - `contact` never leaves your machine or GitHub: it is not sent to any LLM.
#   - Bullets read best at 100-113 characters (one line) or 205-226 (two lines).

