# What the bot searches for, where, and how much it is allowed to spend per run.
# Edit freely; every run reads this file.

candidate:
  # Skip jobs whose stated minimum experience is above this. Jobs that state nothing are kept.
  max_required_years: 4

# One track per kind of role. Queries go to the job sites; keywords decide which track a job belongs to.
tracks:
  java:
    label: Java backend
    queries: ["java backend developer", "java spring boot developer"]
    keywords: ["java", "spring", "spring boot", "hibernate", "jvm", "kotlin", "microservices"]
  python:
    label: Python backend
    queries: ["python backend developer", "python django fastapi developer"]
    keywords: ["python", "django", "fastapi", "flask", "celery"]
  fullstack:
    label: Full-stack JS / Node
    queries: ["full stack developer node react", "node.js backend developer"]
    keywords: ["node", "node.js", "nodejs", "express", "react", "next.js", "typescript", "javascript", "full stack", "fullstack", "mern"]

# A title must contain one of these (case-insensitive) to be considered at all.
title_include:
  - software engineer
  - software developer
  - software development engineer
  - sde
  - backend
  - back-end
  - back end
  - full stack
  - fullstack
  - full-stack
  - java
  - python
  - node
  - developer
  - programmer
  - member of technical staff
  - mts

# A title containing any of these is dropped.
title_exclude:
  - staff
  - principal
  - lead
  - manager
  - director
  - head of
  - vice president
  - vp
  - architect
  - intern
  - internship
  - trainee
  - fresher
  - apprentice
  - apprenticeship
  - new grad
  - new graduate
  - new graduates
  - graduate
  - graduates
  - campus
  - co-op
  - student
  - qa
  - quality
  - test
  - sdet
  - android
  - ios
  - flutter
  - mobile
  - data scientist
  - data analyst
  - data engineer
  - machine learning
  - ml engineer
  - devops
  - sre
  - site reliability
  - support
  - sales
  - salesforce
  - sap
  - abap
  - servicenow
  - sharepoint
  - dynamics
  - wordpress
  - php
  - magento
  - drupal
  - .net
  - dotnet
  - c#
  - unity
  - embedded
  - firmware
  - mainframe
  - cobol
  - mulesoft
  - pega

locations:
  cities: [Gurugram, Noida, Delhi, Bengaluru, Hyderabad, Pune, Chennai]
  include_remote: true
  # Remote roles must be open to candidates in one of these regions (checked on "remote" jobs only).
  remote_regions: [india, anywhere, worldwide, global, apac, asia]
  aliases:
    gurgaon: Gurugram
    "new delhi": Delhi
    "delhi ncr": Delhi
    ncr: Delhi
    "greater noida": Noida
    bangalore: Bengaluru
    bengaluru: Bengaluru
    secunderabad: Hyderabad
    madras: Chennai

limits:
  score_top_k: 30        # new jobs sent to the LLM for scoring per run
  score_batch_size: 8    # jobs per scoring request
  tailor_per_run: 1      # automatic tailored resumes per scheduled run; "Tailor now" is separate
  min_score: 75          # auto-tailor only jobs scoring at least this
  board_max_age_days: 30 # company career boards: ignore postings older than this

# ATS match score (0-100) of each tailored resume against its job description.
ats:
  target: 90       # the review rounds aim for this...
  minimum: 80      # ...below this a fix-up round runs and the dashboard flags the resume

# How each resume is written (one LLM call per round):
#   1. build: read the JD, your skills and preferences, reason, pick keywords, write the resume
#   2. hiring_manager: the role's hiring manager critiques the draft and fixes it
#   3. vp_hiring: a senior hiring manager / VP of hiring critiques it again and rebuilds it
#   4. ATS score (in code, free), plus a fix-up call only if a hard rule is broken or the score is under minimum
# Three calls per resume, four at most. Gemini's free tier allows ~18 Flash calls a day: about 5 resumes.
# The dashboard's Settings page can switch reviewers off (fewer calls) without editing this file.
resume:
  reviewers: [hiring_manager, vp_hiring]
  fix_rounds: 1

# A short cover letter with each tailored resume, from the resume's own facts (one Flash-Lite call).
cover_letter:
  enabled: true

# Each job site can be switched off, or moved to another method, without code changes.
# method: jobspy (LinkedIn/Indeed/Naukri), native (own client), apify (paid-per-result actor)
sources:
  linkedin:
    enabled: true
    method: jobspy
    # The filters of a LinkedIn search URL. Build a search on linkedin.com/jobs, then copy its values here.
    queries: ["back end developer", "java backend developer", "full stack developer node react"]   # keywords=
    location: India
    geo_id: 102713980      # geoId= (India)
    distance: 0            # distance=
    hours_old: 24          # f_TPR=r86400: posted in the past 24 hours
    params: {}             # any other filter as is, e.g. {f_E: "2,3"} entry/associate level, {f_WT: "1,3"} on-site/hybrid
    # f_JIYN (jobs in your network) only works signed in to LinkedIn; the bot reads public listings, so it is left out.
    results_wanted: 30
    fetch_description: true
  indeed:
    enabled: true
    method: jobspy
    location: India
    results_wanted: 30
    hours_old: 13
  naukri:
    enabled: true
    method: jobspy
    location: ""
    results_wanted: 30
    hours_old: 13
  foundit:
    # Experimental: Foundit's own search JSON, not an official API. Its shape can change.
    enabled: true
    method: native
    results_wanted: 30
  wellfound:
    enabled: true
    method: apify
    # Open the actor on apify.com, check its Input tab, and adjust `input` to match.
    actor_id: igolaizola~wellfound-jobs-scraper
    queries: ["backend engineer", "full stack engineer"]
    input:
      keyword: "{query}"
      location: India
      maxItems: 25
    max_charge_usd: 0.10   # hard cap per actor run
    timeout_s: 300
  adzuna:
    enabled: true
    pages: 2
    daily_cap: 200
  jsearch:
    enabled: true
    monthly_cap: 190       # Basic plan is 200/month; keep a margin
    url: https://jsearch.p.rapidapi.com/search-v2   # /search was retired; the host is also sent as X-RapidAPI-Host
  jooble:
    enabled: false
    daily_cap: 100
  remotive:
    enabled: true
  boards:
    enabled: true          # Greenhouse / Lever / Ashby boards listed in config/companies.yaml
